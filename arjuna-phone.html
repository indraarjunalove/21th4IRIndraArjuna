<title>아르주나의 Galaxy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;800&family=Montserrat:wght@800&display=swap">
<style>
/* 레이아웃: 데스크톱은 가운데 갤럭시 프레임, 폰 폭에서는 화면 전체가 폰. 라이트 한 가지로 고정 */
:root{
  --page:#e6ecf1; --frame:#20252b;
  --ink:#1c2733; --ink-sub:#5d6b78;
  --x-bg:#fff; --x-fg:#0f1419; --x-sub:#536471; --x-line:#eff3f4; --x-line2:#cfd9de; --x-blue:#1d9bf0; --x-soft:#eff3f4;
  --kb-bg:#eef1f4; --kb-key:#fff; --kb-key2:#dde2e8;
  --font:"Noto Sans KR","Samsung One",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--page);color:var(--x-fg);font-family:var(--font);display:flex;align-items:center;justify-content:center;padding-inline:16px;overflow:hidden}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--x-blue);outline-offset:2px}

#phone{position:relative;height:min(900px,calc(100% - 32px));aspect-ratio:9/19.5;width:auto;max-width:100%;border-radius:44px;border:8px solid var(--frame);background:#fff;overflow:hidden;box-shadow:0 0 0 2px #3a414a,0 30px 70px rgba(30,45,60,.28);display:flex;flex-direction:column;user-select:none}
#phone::before{content:"";position:absolute;top:10px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#0b0d10;z-index:90}
@media (max-width:600px), (max-aspect-ratio:3/4){
  body{padding-inline:0}
  #phone{width:100%;height:100%;aspect-ratio:auto;border:0;border-radius:0;box-shadow:none}
}

/* 상태바 */
.statusbar{position:absolute;top:0;left:0;right:0;height:34px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:500;color:var(--ink);z-index:80;pointer-events:none;font-variant-numeric:tabular-nums}
.statusbar .right{display:flex;align-items:center;gap:5px}
.statusbar svg{display:block;fill:currentColor}

.screens{position:relative;flex:1;min-height:0}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}

/* 홈화면 */
#home{background:
  radial-gradient(70% 45% at 78% 18%,rgba(255,255,255,.65),transparent 70%),
  linear-gradient(180deg,#c5d5e2 0%,#d9e3eb 38%,#e9eef2 62%,#c9d6cf 100%);
  padding:44px 14px 0}
.todo{grid-column:1/5;grid-row:2/4;align-self:center;margin:0 4px;background:#fff;border-radius:24px;padding:13px 15px 15px;color:#1a1a1a;box-shadow:0 2px 10px rgba(20,30,40,.08)}
.todo .hd{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:8px;border-bottom:1.5px solid #e4e6ea}
.todo .hd b{font-size:13px;font-weight:700}
.todo .hd span{font-size:11px;color:#8a8f98;font-variant-numeric:tabular-nums}
.todo .it{display:flex;gap:10px;align-items:center;margin-top:11px}
.todo .box{width:18px;height:18px;border:2px solid #a77ff0;border-radius:5px;flex:none}
.todo .tx{flex:1;min-width:0;font-size:13px}
.todo .tx small{display:block;font-size:11px;color:#8a8f98;margin-top:2px}
.todo .fl{font-size:11px;color:#e5484d;white-space:nowrap;display:flex;align-items:center;gap:3px}
.ws{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(6,1fr);padding-top:8px}
.ws .app{align-self:center}
.app{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--ink);cursor:default}
.app.live{cursor:pointer}
.ic{position:relative;width:54px;height:54px;display:block}

.shape img{width:100%;height:100%;max-width:none;display:block}
.shape.xic{background:#000}
.badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#f2423c;color:#fff;font-size:11.5px;font-weight:700;display:grid;place-items:center;border:2px solid #fff;transform:scale(0);transition:transform .25s}
.badge.on{transform:scale(1)}
.dots{display:flex;justify-content:center;gap:6px;padding:6px 0 12px}
.dots{align-items:center;padding-bottom:16px}.dots i{width:7px;height:7px;border-radius:50%;background:rgba(28,39,51,.3)}.dots i.on{background:var(--ink)}.dots svg{width:10px;height:10px;fill:rgba(28,39,51,.3)}
.dock{display:grid;grid-template-columns:repeat(4,1fr);padding:4px 8px 58px}

/* 헤드업 알림 */
.heads{position:absolute;top:40px;left:10px;right:10px;z-index:70;background:rgba(255,255,255,.97);border-radius:24px;box-shadow:0 8px 28px rgba(20,30,40,.22);padding:12px 16px 14px;text-align:left;transform:translateY(-200%);transition:transform .45s cubic-bezier(.2,.9,.3,1.15)}
.heads.on{transform:translateY(0)}
.heads.nudge{animation:nudge 6s ease-in-out 1.5s infinite}
@keyframes nudge{0%,88%,100%{transform:translateY(0)}92%{transform:translateY(4px)}96%{transform:translateY(-1px)}}
.heads .top{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--x-sub)}
.heads .top .xi{width:18px;height:18px;border-radius:50%;background:#000;display:grid;place-items:center}
.heads .row{display:flex;gap:12px;align-items:center;margin-top:8px}
.heads .who{font-weight:700;font-size:15px;color:var(--x-fg)}
.heads .msg{font-size:14px;color:var(--x-fg);margin-top:2px;line-height:1.4}

/* X 공통 */
#x{background:var(--x-bg)}
.view{position:absolute;inset:0;padding-top:34px;display:flex;flex-direction:column;background:var(--x-bg)}
#x{padding-bottom:0}
#x .views{position:relative;flex:1;min-height:0}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.glass{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.88);backdrop-filter:blur(12px)}
.av{width:40px;height:40px;border-radius:50%;flex:none;background:#cfd9de;overflow:hidden;display:block;position:relative}
.av svg{position:absolute;left:18%;top:20%;width:64%;height:80%;fill:#fff}
.av.sm{width:32px;height:32px}.av.xs{width:20px;height:20px}.av.md{width:36px;height:36px}.av.lg{width:64px;height:64px}
.av.pf i{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-size:21px;line-height:1;color:#fff;font-weight:600}
.av.pf.xs i{font-size:11px}
.av.pf img{width:100%;height:100%;object-fit:cover;display:block}
.av.xl{width:84px;height:84px;border:4px solid var(--x-bg)}
.x-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:6px 12px 2px 16px}
.x-top #me-av{justify-self:start}
.upg{justify-self:end;display:flex;align-items:center;gap:5px;background:#eff3f4;border-radius:18px;padding:6px 12px 6px 9px;font-size:14px;font-weight:500;color:var(--x-fg)}

.lnk{color:var(--x-blue)}

.quote .tw-text{font-size:14.5px;margin-top:4px}

/* 포스타입 링크 카드 */
.pcard{margin-top:10px}

.pcard .pill{position:absolute;left:10px;bottom:10px;max-width:calc(100% - 20px);background:rgba(0,0,0,.72);color:#fff;font-size:12px;padding:2px 8px;border-radius:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .img.spin{background:#fff;padding:12px 10px 26px;display:block}
.sp-box{position:relative;height:100%;border:2px solid #d9465f;border-radius:10px;display:grid;place-items:center;padding:14px 14px 8px}
.sp-logo{position:absolute;top:-11px;right:14px;background:#fff;padding:0 6px;font-family:"Brush Script MT","Segoe Script",cursive;font-style:italic;font-weight:700;font-size:17px;color:#d9465f}
.sp-q{font-size:12.5px;line-height:1.5;text-align:center;color:#222;word-break:keep-all}
.pcard .src{font-size:13px;color:var(--x-sub);margin-top:4px;padding-left:2px}
.acts{display:flex;justify-content:space-between;margin-top:6px;color:var(--x-sub);font-size:12.5px;font-variant-numeric:tabular-nums;padding-right:2px}
.acts span{display:flex;align-items:center;gap:4px;min-height:34px}
.acts .bs{gap:16px}
.acts svg{width:17px;height:17px;fill:currentColor}

.empty{padding:36px 30px}
.empty h3{font-size:28px;font-weight:800;margin:0 0 8px;line-height:1.2;letter-spacing:-.5px}
.empty p{color:var(--x-sub);font-size:15px;line-height:1.5;margin:0 0 22px}
.empty .btn{background:var(--x-fg);color:#fff;font-weight:700;border-radius:999px;padding:12px 24px;font-size:15px;display:inline-block}

.fab{position:absolute;right:16px;bottom:16px;width:56px;height:56px;border-radius:50%;background:var(--x-blue);display:grid;place-items:center;box-shadow:0 4px 12px rgba(29,155,240,.35)}
.fab svg{width:24px;height:24px;fill:#fff}
.botnav{display:flex;justify-content:space-around;align-items:center;height:52px;border-top:1px solid var(--x-line);background:var(--x-bg);flex:none}
.botnav button{position:relative;width:48px;height:48px;display:grid;place-items:center}
.botnav svg{width:25px;height:25px;fill:var(--x-fg)}
.botnav svg.chat{fill:none;stroke:var(--x-fg);stroke-width:2;stroke-linejoin:round}
.botnav .dot{position:absolute;top:8px;right:6px;min-width:17px;height:17px;border-radius:9px;background:var(--x-blue);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;border:2px solid #fff}

/* 프로필 */
.bar{display:flex;align-items:center;gap:20px;padding:6px 14px;min-height:52px}
.back{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;flex:none}
.back svg{width:20px;height:20px;fill:var(--x-fg)}
.bar .t1{font-weight:800;font-size:17px;line-height:1.2}

.banner{height:118px;background:#cfd9de}
.p-info{padding:0 16px 12px}
.p-row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:-42px}
.p-btn{border:1px solid var(--x-line2);border-radius:999px;padding:7px 16px;font-weight:700;font-size:14px;margin-bottom:4px}
.p-btn.fill{background:var(--x-fg);color:#fff;border-color:var(--x-fg)}
.p-name{font-size:20px;font-weight:800;margin-top:8px}
.p-handle{color:var(--x-sub);font-size:15px}
.p-meta{display:flex;align-items:center;gap:5px;color:var(--x-sub);font-size:14.5px;margin-top:12px}
.p-meta svg{width:18px;height:18px;fill:var(--x-sub)}
.p-ff{display:flex;gap:16px;margin-top:10px;font-size:14.5px;color:var(--x-sub);font-variant-numeric:tabular-nums}
.p-ff b{color:var(--x-fg)}

/* 메시지 목록 */
.m-head{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;padding:6px 16px}
.m-head h2{font-size:19px;font-weight:800;margin:0;text-align:center}
.m-search{margin:6px 16px 10px;border-radius:999px;background:var(--x-soft);padding:9px 16px;font-size:14.5px;color:var(--x-sub)}
.conv{display:flex;gap:12px;padding:12px 16px;width:100%;text-align:left;align-items:center}
.conv:hover{background:#f7f9f9}
.conv .c-body{flex:1;min-width:0}
.conv .c-top{display:flex;gap:4px;font-size:15px;white-space:nowrap}
.conv .c-top .sub{color:var(--x-sub);overflow:hidden;text-overflow:ellipsis}
.conv .c-msg{font-size:14.5px;color:var(--x-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.conv.unread .c-msg{color:var(--x-fg);font-weight:700}
.conv .u{width:10px;height:10px;border-radius:50%;background:var(--x-blue);flex:none}

/* 채팅 */
.c-bar{display:flex;align-items:center;gap:10px;padding:6px 12px;border-bottom:1px solid var(--x-line);min-height:56px}
.c-bar .nm{font-weight:800;font-size:16px;line-height:1.2}
.c-bar .hd{font-size:12.5px;color:var(--x-sub)}
.c-intro{display:flex;flex-direction:column;align-items:center;padding:22px 16px 18px;border-bottom:1px solid var(--x-line);text-align:center;gap:2px}
.c-intro .nm{font-weight:800;font-size:16px;margin-top:8px}
.c-intro .hd,.c-intro .meta{font-size:13.5px;color:var(--x-sub)}
.msgs{display:flex;flex-direction:column;gap:2px;padding:16px 14px 10px}
.bub{max-width:78%;padding:10px 14px;font-size:15px;line-height:1.4;border-radius:22px;word-break:keep-all;overflow-wrap:anywhere;white-space:pre-wrap}
.bub.in{align-self:flex-start;background:var(--x-soft);color:var(--x-fg);border-bottom-left-radius:5px}
.bub.out{align-self:flex-end;background:var(--x-blue);color:#fff;border-bottom-right-radius:5px}
.bub.new{animation:pop .25s ease-out}
@keyframes pop{from{transform:translateY(8px) scale(.96);opacity:0}}
.stamp{font-size:12px;color:var(--x-sub);margin:4px 2px 12px}
.stamp.in{align-self:flex-start}.stamp.out{align-self:flex-end;display:flex;align-items:center;gap:4px}
.stamp svg{width:14px;height:14px;display:block}
.stamp .sending{animation:spin 1s linear infinite}
.typing-bub{display:flex;gap:5px;align-items:center;padding:14px 16px;margin-top:8px}
.typing-bub i{width:8px;height:8px;border-radius:50%;background:#8b98a5;animation:tdot 1.2s ease-in-out infinite}
.typing-bub i:nth-child(2){animation-delay:.15s}.typing-bub i:nth-child(3){animation-delay:.3s}
@keyframes tdot{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.composer{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--x-line);background:#fff;flex:none}
.composer svg{width:22px;height:22px;fill:var(--x-blue);display:block}
.field{cursor:text;flex:1;min-width:0;background:var(--x-soft);border-radius:20px;padding:9px 14px;font-size:15px;color:var(--x-sub);white-space:normal;word-break:break-all;line-height:1.4;min-height:40px}
.field.typing{color:var(--x-fg)}
.caret{display:inline-block;width:1.5px;height:17px;background:var(--x-blue);vertical-align:-3px;margin-left:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.send svg{opacity:.4;transition:opacity .2s}
.send.on svg{opacity:1}

/* 삼성 키보드 */
.kb{flex:none;background:var(--kb-bg);padding:8px 4px 8px;display:flex;flex-direction:column;gap:9px;transition:margin-bottom .3s ease;margin-bottom:-232px;height:232px}
.kb.on{margin-bottom:0}
.kb .r{display:flex;gap:5px;justify-content:center}
.kb .k{flex:1;max-width:36px;height:44px;border-radius:7px;background:var(--kb-key);box-shadow:0 1px 0 rgba(0,0,0,.12);display:grid;place-items:center;font-size:18px;color:#222;transition:background .08s}

.kb .k.sp{max-width:none;flex:5;font-size:12px;color:#888}

.kb .pop{position:absolute;left:50%;bottom:calc(100% + 4px);transform:translateX(-50%);min-width:46px;height:58px;border-radius:10px;background:#fff;box-shadow:0 3px 12px rgba(0,0,0,.22);display:grid;place-items:center;font-size:30px;color:#111;pointer-events:none;z-index:5}
.kb .r.s{padding-inline:18px}

/* 한글을 자모 단위로 쳐 나가는 과정 */
const CHO = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ", JUNG = "ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ";
const JONG = ["", ..."ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ"];
const SPLIT = { "ㅘ":"ㅗㅏ","ㅙ":"ㅗㅐ","ㅚ":"ㅗㅣ","ㅝ":"ㅜㅓ","ㅞ":"ㅜㅔ","ㅟ":"ㅜㅣ","ㅢ":"ㅡㅣ","ㄳ":"ㄱㅅ","ㄵ":"ㄴㅈ","ㄶ":"ㄴㅎ","ㄺ":"ㄹㄱ","ㄻ":"ㄹㅁ","ㄼ":"ㄹㅂ","ㄽ":"ㄹㅅ","ㄾ":"ㄹㅌ","ㄿ":"ㄹㅍ","ㅀ":"ㄹㅎ","ㅄ":"ㅂㅅ" };
const DOUBLE = { "ㄲ":"ㄱ","ㄸ":"ㄷ","ㅃ":"ㅂ","ㅆ":"ㅅ","ㅉ":"ㅈ","ㅒ":"ㅐ","ㅖ":"ㅔ" };
const syl = (c, j, t) => String.fromCharCode(0xAC00 + c * 588 + j * 28 + t);
function keySteps(text) {
  const steps = []; let done = "";
  const key = k => DOUBLE[k] || k;
  for (const ch of text) {
    const code = ch.charCodeAt(0) - 0xAC00;
    if (code < 0 || code > 11171) { done += ch; steps.push({ key: ch, show: done }); continue; }
    const c = Math.floor(code / 588), j = Math.floor(code % 588 / 28), t = code % 28;
    steps.push({ key: key(CHO[c]), show: done + CHO[c] });
    const jp = SPLIT[JUNG[j]];
    if (jp) steps.push({ key: jp[0], show: done + syl(c, JUNG.indexOf(jp[0]), 0) });
    steps.push({ key: key(jp ? jp[1] : JUNG[j]), show: done + syl(c, j, 0) });
    if (t) {
      const tp = SPLIT[JONG[t]];
      if (tp) steps.push({ key: tp[0], show: done + syl(c, j, JONG.indexOf(tp[0])) });
      steps.push({ key: key(tp ? tp[1] : JONG[t]), show: done + ch });
    }
    done += ch;
  }
  return steps;
}
function hit(k) {
  const el = [...document.querySelectorAll("#kb [data-k]")].find(e => e.dataset.k === k);
  if (!el) return;
  el.classList.add("hit"); setTimeout(() => el.classList.remove("hit"), 110);
  if (el.classList.contains("w") || el.classList.contains("sp")) return;   // 글자 키만 확대 팝업
  document.querySelectorAll("#kb .pop").forEach(p => p.remove());
  const pop = document.createElement("span"); pop.className = "pop"; pop.textContent = el.textContent;
  el.appendChild(pop); setTimeout(() => pop.remove(), 170);
}

/* 한 글자씩 치기. slow면 머뭇거리면서 */
async function typeText(text, slow) {
  const steps = keySteps(text);
  for (let i = 0; i < steps.length; i++) {
    const s = steps[i];
    hit(s.key); showField(s.show);
    let d = slow ? 200 + Math.random() * 220 : 110 + Math.random() * 120;
    if (s.key === " ") d += slow ? 500 : 260;
    if (!slow && i === 6) d += 700;
    if (slow && (i === 5 || i === 13)) d += 900;
    await sleep(d);
  }
}
/* ⌫ 꾹 눌러서 지우기: 처음엔 천천히, 갈수록 빠르게 */
async function deleteText(text) {
  let chars = Array.from(text);
  let d = 260;
  while (chars.length) {
    chars.pop(); hit("⌫"); showField(chars.join(""));
    await sleep(d); d = Math.max(70, d * 0.8);
  }
}

}

  await sleep(2200);
  kbUp();
  await sleep(1000);
  await typeText(DM.hesitate, true);       // 머뭇머뭇
  await sleep(1800);
  await deleteText(DM.hesitate);           // 다 지움
  await sleep(1400);
  await typeText(DM.final);
  await sleep(900);

}

const TYPING_BUBBLE = '<div class="bub in typing-bub new"><i></i><i></i><i></i></div>';
const stampOut = () => `${CONFIG.ampm} ${CONFIG.time}` + (lastOut === "sending" ? SENDING : ` · 읽음${READ}`);
$("#field").addEventListener("click", runDM);   // 처음 한 번만 반응

/* 메시지 앱 그리기 */
const MEGA = '<svg viewBox="0 0 24 24"><path d="M3 10v4a1 1 0 0 0 1 1h2l1 5h3l-1-5h1l7 4V5l-7 4H4a1 1 0 0 0-1 1zm17-1v6a3 3 0 0 0 0-6z"/></svg>';
const smsAv = c => c.av === "alert" ? MEGA : c.av === "none" ? PERSON : c.av === "tel" ? "T" : esc(c.name[0]);
$("#s-list").innerHTML = SMS.map((c, i) => `<${c.open ? `button data-sms="${i}"` : "div"} class="s-row"><span class="s-av ${c.av}">${smsAv(c)}</span>
  <span class="r"><span class="txt"><div class="nm">${esc(c.name)}</div>${(c.text || (c.msgs && c.msgs.at(-1))) ? `<div class="pv">${esc(c.text || c.msgs.at(-1))}</div>` : ""}</span>
  <span class="meta"><span class="dt">${esc(c.date)}</span>${c.badge ? `<span class="cnt">${c.badge}</span>` : ""}</span></span></${c.open ? "button" : "div"}>`).join("");
let smsView = "list";
function renderSmsChat() {
  const c = SMS.find(c => c.open);
  $("#s-c-av").textContent = c.name[0]; $("#s-c-nm").textContent = c.name;
  $("#s-chat").innerHTML = `<div class="s-day">${esc(c.day)}</div>` +
    c.msgs.map((m, i) => `<div class="s-in"><span class="b">${esc(m)}</span>${i === c.msgs.length - 1 ? `<span class="t">${esc(c.time)}</span>` : ""}</div>`).join("");
}
$("#sms").addEventListener("click", e => {
  if (e.target.closest("[data-sback]")) return back();
  if (e.target.closest("[data-sms]")) { smsView = "chat"; mark(); paint(); }
});

/* ---------- 화면 이동 ---------- */
let screen = "home";
let autoTok = 0;   // DM 창 자동 타자 타이머
let xStack = ["timeline"];
const VIEWS = { timeline: "#v-timeline", profile: "#v-profile", dmlist: "#v-dmlist", chat: "#v-chat" };
const onChat = () => screen === "x" && xStack[xStack.length - 1] === "chat";

function paint() {
  setTimeout(placeNotif);
  $("#home").hidden = screen !== "home";
  $("#x").hidden = screen !== "x";
  $("#gem").hidden = screen !== "gem";
  $("#sms").hidden = screen !== "sms";
  if (screen === "sms") { $("#s-list-v").hidden = smsView !== "list"; $("#s-chat-v").hidden = smsView !== "chat"; if (smsView === "chat") renderSmsChat(); }
  $("#navbar").classList.toggle("clear", screen === "home");
  if (screen !== "x") return;
  const [name, arg] = xStack[xStack.length - 1].split(":");
  for (const k in VIEWS) $(VIEWS[k]).hidden = k !== name;
  $("#botnav").hidden = name === "chat";
  if (name === "profile") { renderProfile(arg); $("#pf-scroll").scrollTop = 0; }
  if (name === "dmlist") renderDmList();
  if (name === "chat") {
    renderChat(false);
    if (phase === "wait") { const tk = ++autoTok; setTimeout(() => { if (tk === autoTok && onChat()) runDM(); }, DM.autoStartSec * 1000); }
    if (!dmRead) { dmRead = true; clearHeads(); }
  }
}
function mark() { try { history.pushState({ phone: 1 }, ""); } catch (e) {} }
function push(view) { xStack.push(view); mark(); paint(); }
function back() {
  if (drawerOpen) { setDrawer(false); return; }
  if (screen === "gem") screen = "home";
  else if (screen === "sms") { if (smsView === "chat") smsView = "list"; else screen = "home"; }
  else if (screen === "x") { if (xStack.length > 1) xStack.pop(); else screen = "home"; }
  paint();
}
function openX(stack) { if (stack) xStack = stack; screen = "x"; mark(); paint(); }

addEventListener("popstate", back);   // 브라우저 뒤로가기도 폰 뒤로가기처럼
$("#nb-back").addEventListener("click", back);
$("#nb-home").addEventListener("click", () => { screen = "home"; paint(); });

$("#x").addEventListener("click", e => {
  if (e.target.closest("[data-back]")) return back();
  if (e.target.closest("[data-open-chat]")) return push("chat");
  const tab = e.target.closest("[data-tab]");
  if (tab) { xStack = tab.dataset.tab === "dm" ? ["timeline", "dmlist"] : ["timeline"]; paint(); return; }
  const tr = e.target.closest("[data-tr]");
  if (tr) {   // Grok 번역 ↔ 원문 전환 (타임라인에서 유일하게 눌리는 것)
    const art = tr.closest("article.tw"), on = tr.dataset.orig !== "1";
    const tw = TWEETS.filter(t => t.tr && t.feed === feed)[[...$("#feed").querySelectorAll("[data-tr]")].indexOf(tr)];
    tr.dataset.orig = on ? "1" : "";
    art.querySelector("[data-tr-text]").innerHTML = rich(on ? tw.text : tw.tr.text);
    tr.innerHTML = GLOBE + (on ? `원문 · <b>번역 보기</b>` : `${esc(tw.tr.lang)}에서 Grok으로 번역됨 · <b>원문 보기</b>`);
    return;
  }
  if (e.target.closest("#feed")) {   // 타임라인 트윗은 눌러도 반응 없음 (스크롤만). 내 트윗의 프사·이름만 내 프로필로
    const art = e.target.closest("article.tw"), me = art && art.querySelector(`[data-user="${CONFIG.me}"]`);
    if (me && e.target.closest("button[data-user], .nm, .sub")) push("profile:" + CONFIG.me);
    return;
  }
  const u = e.target.closest("[data-user]");
  if (u) push("profile:" + u.dataset.user);
});
/* 왼쪽 프사 → 슬라이드 메뉴. 메뉴에서는 프로필(프사·이름 줄 포함)만 눌림 */
let drawerOpen = false;
function setDrawer(on) { drawerOpen = on; $("#drawer").classList.toggle("open", on); }
$("#me-av").addEventListener("click", () => { setDrawer(true); mark(); });
$("#dm-me").addEventListener("click", () => { setDrawer(true); mark(); });   // DM 목록 왼쪽 위 프사도 같은 메뉴
$("#drawer").addEventListener("click", e => {
  if (e.target.closest("[data-dprof]")) { setDrawer(false); push("profile:" + CONFIG.me); return; }
  if (e.target.closest("[data-dclose]")) back();
});

/* 홈화면: X 말고는 눌러도 아무 일 없음 */
function appHTML(a) {
  const ic = a.img === "x" ? `<span class="ic"><span class="shape xic">${xlogo(28, "#fff")}</span><span class="badge" id="x-badge">1</span></span>`
    : `<span class="ic"><span class="shape"><img src="${ICON_IMG[a.img]}" alt=""></span>${a.badge ? `<span class="badge on">${a.badge}</span>` : ""}</span>`;
  const at = a.at ? ` style="grid-row:${a.at[0]};grid-column:${a.at[1]}"` : "";
  return `<button class="app ${a.live ? "live" : ""}"${at} ${a.live ? `data-live="${a.live}"` : 'tabindex="-1"'}>${ic}${a.name ? esc(a.name) : ""}</button>`;
}
$("#grid").insertAdjacentHTML("beforeend", APPS.map(appHTML).join(""));
$("#dock").innerHTML = DOCK.map(appHTML).join("");
$("#home").addEventListener("click", e => {
  const a = e.target.closest("[data-live]"); if (!a) return;
  if (a.dataset.live === "x") openX();
  else if (a.dataset.live === "sms") { screen = "sms"; smsView = "list"; mark(); paint(); $("#s-scroll").scrollTop = 0; }
  else { screen = "gem"; mark(); paint(); $("#gem-scroll").scrollTop = 0; }
});

/* DM 알림: 한 번 오면 DM 창을 열 때까지 안 사라짐 */
/* 알림 표시 위치: X 밖(홈·제미나이·메시지) = One UI 대화 알림, X 안 = X 앱 내 배너 */
function clearHeads() { $("#heads").classList.remove("on", "nudge"); $("#xin").classList.remove("on"); $("#x-badge").classList.remove("on"); $("#dm-dot").hidden = true; }
function placeNotif() {
  if (!dmArrived || dmRead) return;
  const inX = screen === "x";
  $("#heads").classList.toggle("on", !inX); $("#heads").classList.toggle("nudge", !inX);
  $("#xin").classList.toggle("on", inX && !["dmlist", "chat"].includes(xStack[xStack.length - 1]));
}
$("#xin-av").innerHTML = PERSON; $("#xin-who").textContent = sender.name;
$("#xin-msg").textContent = DM.incoming.replace(/\n/g, " ");
$("#xin").addEventListener("click", () => openX(["timeline", "dmlist", "chat"]));
$("#h-bdg").innerHTML = xlogo(8, "#fff");
$("#hx").innerHTML = xlogo(10, "#fff");
$("#h-av").innerHTML = PERSON;
$("#h-who").textContent = sender.name;
$("#h-msg").textContent = DM.incoming.replace(/\n/g, " ");
$("#heads").addEventListener("click", () => openX(["timeline", "dmlist", "chat"]));
setTimeout(() => {
  dmArrived = true;
  placeNotif();
  $("#x-badge").classList.add("on");
  $("#dm-dot").hidden = false;
  if (screen === "x" && xStack[xStack.length - 1] === "dmlist") renderDmList();
}, CONFIG.dmAfterSec * 1000);

/* 시계·배터리 */
$("#sb-time").textContent = CONFIG.time;
$("#todo").innerHTML = `<div class="hd"><b>오늘 할 일 · ${esc(TODO.date)}</b><span>0/${TODO.items.length}</span></div>` + TODO.items.map(t => `<div class="it"><span class="box"></span><div class="tx">${esc(t.title)}${t.note ? `<small>${esc(t.note)}</small>` : ""}</div>${t.flag ? `<span class="fl"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 1v10" stroke="#e5484d" stroke-width="1.4"/><path d="M2.6 1.5h7l-1.8 2.5 1.8 2.5h-7z" fill="#e5484d"/></svg>${esc(t.flag)}</span>` : ""}</div>`).join("");
$("#sb-batt").textContent = CONFIG.battery + "%";
$("#sb-batt-fill").setAttribute("width", Math.max(1, 16 * CONFIG.battery / 100));
$("#me-av").innerHTML = av("sm");
$("#d-av").innerHTML = av("", USERS[CONFIG.me]);
$("#d-name").textContent = USERS[CONFIG.me].name;
$("#d-handle").textContent = "@" + USERS[CONFIG.me].handle;
$("#d-ff").innerHTML = `<span><b>${USERS[CONFIG.me].following}</b>팔로우 중</span><span><b>${USERS[CONFIG.me].followers}</b>팔로워</span>`;
$("#upg").innerHTML = VERI + "업그레이드";
$("#dm-me").innerHTML = av("sm");
$("#x-logo").innerHTML = xlogo(26, "#0f1419");
$("#c-back").innerHTML = ICONS.back;

const SPARK = '<svg class="g-spark" viewBox="0 0 24 24"><defs><linearGradient id="gsp" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#1c7df2"/><stop offset=".5" stop-color="#7a6cf0"/><stop offset="1" stop-color="#e46c8c"/></linearGradient></defs><path fill="url(#gsp)" d="M12 2c.6 5.4 4.6 9.4 10 10-5.4.6-9.4 4.6-10 10-.6-5.4-4.6-9.4-10-10 5.4-.6 9.4-4.6 10-10z"/></svg>';
const GACTS = '<div class="g-acts"><svg viewBox="0 0 24 24"><path d="M9 21h9c.8 0 1.5-.5 1.8-1.2l3-7.1c.1-.2.2-.5.2-.7v-2c0-1.1-.9-2-2-2h-6.3l1-4.6v-.3c0-.4-.2-.8-.4-1.1L14.2 1 7.6 7.6C7.2 8 7 8.5 7 9v10c0 1.1.9 2 2 2zm0-12 4.3-4.3L12 10h9v2l-3 7H9zM1 9h4v12H1z"/></svg><svg viewBox="0 0 24 24"><path d="M15 3H6c-.8 0-1.5.5-1.8 1.2l-3 7.1c-.1.2-.2.5-.2.7v2c0 1.1.9 2 2 2h6.3l-1 4.6v.3c0 .4.2.8.4 1.1L9.8 23l6.6-6.6c.4-.4.6-.9.6-1.4V5c0-1.1-.9-2-2-2zm0 12-4.3 4.3L12 14H3v-2l3-7h9zm4-12h4v12h-4z"/></svg><svg viewBox="0 0 24 24"><path d="M17.65 6.35A8 8 0 1 0 19.73 14h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4z"/></svg><svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11z"/></svg></div>';
const md = t => esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").split(/\n{2,}/).map(p => `<p>${p.replace(/\n/g, "<br>")}</p>`).join("");
$("#gem-chat").innerHTML = GEMINI.map(m => m.who === "me"
  ? `<div class="g-u">${esc(m.text)}</div>`
  : `<div class="g-a">${SPARK}<div class="body">${md(m.text)}</div>${GACTS}</div>`).join("");

renderFeed();
paint();
</script>
